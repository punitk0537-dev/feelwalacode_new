- stage: plan
  displayName: Plan
  jobs:
    - job: plan
      displayName: Plan
      steps:
    
      - task: TerraformTask@5
        displayName: init
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: '$(System.DefaultWorkingDirectory)/envirments/prod'
          backendServiceArm: 'punityml'
          backendAzureRmStorageAccountName: 'punitsa'
          backendAzureRmContainerName: 'tfstate'
          backendAzureRmKey: 'prod.terraform.tfstate'
      - task: TerraformTask@5
        displayName: plan
        inputs:
          provider: 'azurerm'
          command: 'plan'
          workingDirectory: '$(System.DefaultWorkingDirectory)/envirments/prod'
          environmentServiceNameAzureRM: 'punityml'
- stage: Apporval
  displayName: ManualApproval
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  pool: server
  jobs:
    - job: Approval
      displayName: Approval
      steps:
      - task: ManualValidation@1
        inputs:
          notifyUsers: 'abc'
          instructions: 'plan check krke approve kr do'
