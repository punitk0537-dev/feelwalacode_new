pool: punit
trigger:
 branches:
   include:
      - main
      - features/*
 paths:
   include:    # ye pipe lin jab chalegi jab koi changes hoga envirments/prod folder iske workingDirectory: '$(System.DefaultWorkingDirectory)/envirments/prod' path denge in stage
    - envirments/prod/*

